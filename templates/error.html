{% extends "base.html" %}

{% block title %}Ошибка {{ status_code }} | Ачинск туристический{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 {% if status_code >= 500 %}text-danger{% else %}text-primary{% endif %}">{{ status_code }}</h1>
    <h2 class="mb-4">{{ title }}</h2>
    <p class="text-muted mb-4">{{ message }}</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="/" class="btn btn-primary">На главную</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Назад</a>
    </div>
</div>
{% endblock %}
