{% extends "base.html" %}

{% block title %}Достопримечательности | Ачинск туристический{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Достопримечательности Ачинска</h1>
    <a href="/" class="btn btn-outline-secondary">← На главную</a>
</div>

<!-- Поиск и фильтры -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Поиск по названию...">
            </div>
            <div class="col-md-3">
                <button id="searchBtn" class="btn btn-primary w-100">Найти</button>
            </div>
            <div class="col-md-3">
                <button id="resetBtn" class="btn btn-outline-secondary w-100">Сбросить</button>
            </div>
        </div>
    </div>
</div>

<!-- Список объектов -->
<div id="attractionsList" class="row g-4">
    <!-- Карточки будут добавлены через JavaScript -->
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
        <p class="mt-2 text-muted">Загрузка достопримечательностей...</p>
    </div>
</div>

<!-- Пагинация -->
<nav id="pagination" class="mt-4" aria-label="Навигация по страницам">
    <ul class="pagination justify-content-center">
        <!-- Кнопки пагинации будут добавлены через JavaScript -->
    </ul>
</nav>
{% endblock %}

{% block scripts %}
<script>
// Загрузка достопримечательностей
async function loadAttractions(search = '', page = 1, limit = 12) {
    const listEl = document.getElementById('attractionsList');
    const paginationEl = document.getElementById('pagination');
    
    try {
        // Формируем URL с параметрами
        let url = `/api/attractions/?skip=${(page - 1) * limit}&limit=${limit}`;
        if (search) {
            url += `&search=${encodeURIComponent(search)}`;
        }
        
        const data = await apiRequest(url);
        
        // Очищаем список
        listEl.innerHTML = '';
        
        if (data.length === 0) {
            listEl.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">Ничего не найдено</p></div>';
            return;
        }
        
        // Создаём карточки
        data.forEach(item => {
            const card = `
                <div class="col-md-4 col-sm-6">
                    <div class="card h-100 shadow-sm">
                        ${item.photo_url ? `<img src="${item.photo_url}" class="card-img-top" alt="${item.name}" style="height: 200px; object-fit: cover;">` : ''}
                        <div class="card-body">
                            <h5 class="card-title">${item.name}</h5>
                            <p class="card-text text-muted small">${item.address || ''}</p>
                            <p class="card-text">${item.description?.substring(0, 100)}${item.description?.length > 100 ? '...' : ''}</p>
                            <a href="#" class="btn btn-outline-primary btn-sm">Подробнее</a>
                        </div>
                    </div>
                </div>
            `;
            listEl.insertAdjacentHTML('beforeend', card);
        });
        
        // TODO: Реализовать пагинацию (кнопки "Назад"/"Вперёд")
        
    } catch (err) {
        listEl.innerHTML = `<div class="col-12 text-center py-5 text-danger">Ошибка загрузки: ${err.message}</div>`;
        console.error('Ошибка загрузки достопримечательностей:', err);
    }
}

// Инициализация
document.addEventListener('DOMContentLoaded', () => {
    loadAttractions();
    
    // Поиск
    document.getElementById('searchBtn').addEventListener('click', () => {
        const search = document.getElementById('searchInput').value;
        loadAttractions(search);
    });
    
    // Сброс
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        loadAttractions();
    });
    
    // Поиск по Enter
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('searchBtn').click();
        }
    });
});
</script>
{% endblock %}
