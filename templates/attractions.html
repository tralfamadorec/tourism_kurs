{% extends "base.html" %}

{% block title %}Достопримечательности Ачинска{% endblock %}

{% block content %}
<div class="text-center py-4 bg-light rounded mb-4">
    <h1>Достопримечательности Ачинска</h1>
    <p class="text-muted">Музеи, памятники, парки и знаковые места города</p>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label small text-muted">Поиск</label>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Название или адрес...">
            </div>
            
            <div class="col-md-3">
                <label class="form-label small text-muted">Рейтинг</label>
                <select id="ratingFilter" class="form-select form-select-sm">
                    <option value="">Любой рейтинг</option>
                    <option value="4">4.0+</option>
                    <option value="3">3.0+</option>
                </select>
            </div>
            
            <div class="col-md-3">
                <label class="form-label small text-muted">Доступность</label>
                <select id="accessibilityFilter" class="form-select form-select-sm">
                    <option value="">Все объекты</option>
                    <option value="accessible">Доступно для МГН</option>
                </select>
            </div>
            
            <div class="col-md-2 d-flex align-items-end">
                <button id="resetBtn" class="btn btn-outline-secondary btn-sm w-100">Сбросить</button>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <label class="form-label small text-muted d-block mb-2">Сортировка</label>
                <div class="btn-group w-100" role="group">
                    <button type="button" class="btn btn-outline-primary btn-sm active" data-sort="rating">По популярности</button>
                    <button type="button" class="btn btn-outline-primary btn-sm" data-sort="name">По алфавиту</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="attractionsList" class="row g-4">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Загрузка достопримечательностей...</p>
    </div>
</div>

<div class="text-center mt-5 mb-4">
    <button id="loadMoreBtn" class="btn btn-outline-primary btn-lg px-5 d-none">
        Показать еще
    </button>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
const limit = 6;
let currentSort = 'rating';

async function loadAttractions(append = false) {
    const listEl = document.getElementById('attractionsList');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    if (!append) {
        listEl.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Загрузка...</p></div>';
    }
    
    try {
        const search = document.getElementById('searchInput').value;
        const minRating = document.getElementById('ratingFilter').value;
        const accessible = document.getElementById('accessibilityFilter').value;
        
        let url = `/api/attractions/?limit=${limit}&skip=${(currentPage - 1) * limit}`;
        
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (minRating) url += `&min_rating=${minRating}`;
        if (accessible === 'accessible') url += `&accessibility=accessible`;
        url += `&sort=${currentSort}`;

        const response = await fetch(url);
        const data = await response.json();
        
        if (!append) listEl.innerHTML = '';
        
        if (data.length === 0 && currentPage === 1) {
            listEl.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">Достопримечательности не найдены</p></div>';
            loadMoreBtn.classList.add('d-none');
            return;
        }
        
        if (data.length === 0) {
            loadMoreBtn.classList.add('d-none');
            return;
        }
        
        data.forEach(item => {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            
            const stars = '⭐'.repeat(Math.round(item.rating || 0));
            
            col.innerHTML = `
                <div class="card h-100 shadow-sm hover-shadow">
                    ${item.photo_url ? `<img src="${item.photo_url}" class="card-img-top" alt="${item.name}" style="height: 200px; object-fit: cover;">` : '<div class="bg-secondary text-white d-flex align-items-center justify-content-center" style="height: 200px;">Нет фото</div>'}
                    <div class="card-body">
                        <h5 class="card-title">${item.name}</h5>
                        <p class="card-text small text-muted">${item.address || 'Адрес не указан'}</p>
                        <p class="card-text small">${item.description?.substring(0, 80) || ''}${item.description?.length > 80 ? '...' : ''}</p>
                        ${item.is_accessible ? '<span class="badge bg-success mb-2">Доступно для МГН</span>' : ''}
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span>Рейтинг:</span>
                            <span class="text-warning">${stars || '—'}</span>
                        </li>
                    </ul>
                    <div class="card-body pt-0">
                        <a href="/attractions/${item.id}" class="btn btn-outline-primary w-100">Подробнее →</a>
                    </div>
                </div>
            `;
            listEl.appendChild(col);
        });
        
        if (data.length === limit) {
            loadMoreBtn.classList.remove('d-none');
        } else {
            loadMoreBtn.classList.add('d-none');
        }
        
    } catch (err) {
        listEl.innerHTML = `<div class="col-12 text-center text-danger py-5">Ошибка загрузки: ${err.message}</div>`;
    }
}

// обработчики фильтров
document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; loadAttractions(); });
document.getElementById('ratingFilter').addEventListener('change', () => { currentPage = 1; loadAttractions(); });
document.getElementById('accessibilityFilter').addEventListener('change', () => { currentPage = 1; loadAttractions(); });

// обработчики сортировки
document.querySelectorAll('[data-sort]').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentSort = e.target.dataset.sort;
        currentPage = 1;
        loadAttractions();
    });
});

// кнопка сброса
document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('ratingFilter').value = '';
    document.getElementById('accessibilityFilter').value = '';
    currentSort = 'rating';
    currentPage = 1;
    
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-sort="rating"]').classList.add('active');
    
    loadAttractions();
});

// показать еще
document.getElementById('loadMoreBtn').addEventListener('click', () => {
    currentPage++;
    loadAttractions(true);
});

// инициализация
document.addEventListener('DOMContentLoaded', () => loadAttractions());
</script>

<style>
.hover-shadow {
    transition: box-shadow 0.3s ease;
}
.hover-shadow:hover {
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
}
</style>
{% endblock %}
