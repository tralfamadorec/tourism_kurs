{% extends "admin/base_admin.html" %}

{% block title %}Управление событиями{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>События и мероприятия</h2>
    <a href="/admin/events/new" class="btn btn-primary">➕ Добавить событие</a>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Название</th>
                        <th>Дата и время</th>
                        <th>Место проведения</th>
                        <th class="text-end">Действия</th>
                    </tr>
                </thead>
                <tbody id="eventsTable">
                    <tr><td colspan="4" class="text-center py-4">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
async function loadEvents() {
    const tbody = document.getElementById('eventsTable');
    try {
        const data = await apiRequest('/api/events/?limit=100');
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">Нет запланированных событий</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(event => `
            <tr>
                <td><strong>${event.title}</strong><br><small class="text-muted">${event.description?.substring(0, 40)}...</small></td>
                <td>${event.event_date ? new Date(event.event_date).toLocaleString('ru-RU', {dateStyle:'short', timeStyle:'short'}) : '—'}</td>
                <td>${event.location || '—'}</td>
                <td class="text-end">
                    <a href="/admin/events/${event.id}/edit" class="btn btn-sm btn-outline-primary">✏️</a>
                    <button onclick="deleteEvent(${event.id})" class="btn btn-sm btn-outline-danger">🗑️</button>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Ошибка загрузки: ${err.message}</td></tr>`;
    }
}

async function deleteEvent(id) {
    if (!confirm('Удалить это событие?')) return;
    try {
        await apiRequest(`/api/events/${id}`, { method: 'DELETE' });
        loadEvents();
    } catch (err) {
        alert('Ошибка удаления: ' + err.message);
    }
}

document.addEventListener('DOMContentLoaded', loadEvents);
</script>
{% endblock %}
