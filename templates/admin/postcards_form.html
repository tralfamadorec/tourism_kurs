{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Редактировать' if is_edit else 'Новый' }} шаблон открытки{% endblock %}
{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ title }}</h2>
    <a href="/admin/postcards" class="btn btn-outline-secondary">← Назад</a>
</div>
<div class="card">
    <div class="card-body">
        <form id="postcardForm">
            <div class="mb-3">
                <label for="title" class="form-label">Название шаблона *</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="image_url" class="form-label">Ссылка на изображение *</label>
                <input type="url" class="form-control" id="image_url" name="image_url" placeholder="/static/images/postcards/..." required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            <div id="formError" class="alert alert-danger d-none" role="alert"></div>
            <div id="formSuccess" class="alert alert-success d-none" role="alert">Сохранено!</div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 Сохранить</button>
                <a href="/admin/postcards" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
{{ super() }}
<script>
const form = document.getElementById('postcardForm');
const isEdit = {{ 'true' if is_edit else 'false' }};
const itemId = {{ item_id if is_edit else 'null' }};

if (isEdit && itemId) loadPostcardData(itemId);

async function loadPostcardData(id) {
    try {
        const data = await apiRequest(`/api/postcards/${id}`);
        document.getElementById('title').value = data.title || '';
        document.getElementById('image_url').value = data.image_url || '';
        document.getElementById('description').value = data.description || '';
    } catch (err) {
        document.getElementById('formError').textContent = 'Ошибка загрузки: ' + err.message;
        document.getElementById('formError').classList.remove('d-none');
    }
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('formError');
    const successDiv = document.getElementById('formSuccess');
    errorDiv.classList.add('d-none'); successDiv.classList.add('d-none');

    const data = {};
    new FormData(form).forEach((value, key) => { if (value) data[key] = value; });

    try {
        const url = isEdit ? `/api/postcards/${itemId}` : '/api/postcards/';
        const method = isEdit ? 'PUT' : 'POST';
        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getCookie('access_token')}` },
            body: JSON.stringify(data)
        });
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || 'Ошибка сохранения');
        }
        successDiv.classList.remove('d-none');
        setTimeout(() => { window.location.href = '/admin/postcards'; }, 1500);
    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
