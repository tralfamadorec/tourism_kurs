{% extends "admin/base_admin.html" %}

{% block title %}Управление маршрутами{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Туристические маршруты</h2>
    <a href="/admin/routes/new" class="btn btn-primary">➕ Добавить маршрут</a>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Название</th>
                        <th>Длительность</th>
                        <th>Сложность</th>
                        <th>Транспорт</th>
                        <th class="text-end">Действия</th>
                    </tr>
                </thead>
                <tbody id="routesTable">
                    <tr><td colspan="5" class="text-center py-4">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
async function loadRoutes() {
    const tbody = document.getElementById('routesTable');
    try {
        const data = await apiRequest('/api/routes/?limit=100');
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">Нет созданных маршрутов</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(route => `
            <tr>
                <td><strong>${route.title}</strong><br><small class="text-muted">${route.description?.substring(0, 50)}...</small></td>
                <td>${route.duration_hours || '—'} ч.</td>
                <td><span class="badge bg-secondary">${route.difficulty || '—'}</span></td>
                <td>${route.transport_type || '—'}</td>
                <td class="text-end">
                    <a href="/admin/routes/${route.id}/edit" class="btn btn-sm btn-outline-primary">✏️</a>
                    <button onclick="deleteRoute(${route.id})" class="btn btn-sm btn-outline-danger">🗑️</button>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Ошибка загрузки: ${err.message}</td></tr>`;
    }
}

async function deleteRoute(id) {
    if (!confirm('Удалить этот маршрут?')) return;
    try {
        await apiRequest(`/api/routes/${id}`, { method: 'DELETE' });
        loadRoutes();
    } catch (err) {
        alert('Ошибка удаления: ' + err.message);
    }
}

document.addEventListener('DOMContentLoaded', loadRoutes);
</script>
{% endblock %}
