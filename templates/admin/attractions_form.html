{% extends "admin/form.html" %}

{% block title %}{{ 'Редактировать' if is_edit else 'Добавить' }} достопримечательность{% endblock %}

{% block form_fields %}
<input type="hidden" name="id" value="{{ item.id if item else '' }}">

<div class="mb-3">
    <label for="name" class="form-label">Название *</label>
    <input type="text" class="form-control" id="name" name="name" 
           value="{{ item.name if item else '' }}" required>
</div>

<div class="mb-3">
    <label for="description" class="form-label">Описание</label>
    <textarea class="form-control" id="description" name="description" rows="4">{{ item.description if item else '' }}</textarea>
</div>

<div class="mb-3">
    <label for="address" class="form-label">Адрес</label>
    <input type="text" class="form-control" id="address" name="address" 
           value="{{ item.address if item else '' }}">
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label for="latitude" class="form-label">Широта</label>
        <input type="number" step="any" class="form-control" id="latitude" name="latitude" 
               value="{{ item.latitude if item else '' }}">
    </div>
    <div class="col-md-6 mb-3">
        <label for="longitude" class="form-label">Долгота</label>
        <input type="number" step="any" class="form-control" id="longitude" name="longitude" 
               value="{{ item.longitude if item else '' }}">
    </div>
</div>

<div class="mb-3">
    <label for="photo_url" class="form-label">URL фотографии</label>
    <input type="url" class="form-control" id="photo_url" name="photo_url" 
           value="{{ item.photo_url if item else '' }}">
    <small class="text-muted">Например: /static/images/museum.jpg</small>
</div>
{% endblock %}
