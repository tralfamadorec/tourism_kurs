{% extends "admin/base_admin.html" %}

{% block title %}{{ 'Редактировать' if is_edit else 'Новый' }} маршрут{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ title }}</h2>
    <a href="/admin/routes" class="btn btn-outline-secondary">← Назад к списку</a>
</div>

<div class="card">
    <div class="card-body">
        <form id="routeForm">
            <div class="mb-3">
                <label for="title" class="form-label">Название маршрута *</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea class="form-control" id="description" name="description" rows="4"></textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="duration_hours" class="form-label">Длительность (часов)</label>
                    <input type="number" step="0.5" class="form-control" id="duration_hours" name="duration_hours">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="difficulty" class="form-label">Сложность</label>
                    <select class="form-select" id="difficulty" name="difficulty">
                        <option value="">Выберите...</option>
                        <option value="Лёгкий">Лёгкий</option>
                        <option value="Средний">Средний</option>
                        <option value="Сложный">Сложный</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="transport_type" class="form-label">Транспорт</label>
                    <select class="form-select" id="transport_type" name="transport_type">
                        <option value="">Выберите...</option>
                        <option value="Пешком">Пешком</option>
                        <option value="Автомобиль">Автомобиль</option>
                        <option value="Автобус">Автобус</option>
                    </select>
                </div>
            </div>

            <div class="col-md-6 mb-3 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_accessible" name="is_accessible">
                    <label class="form-check-label" for="is_accessible">
                        Доступно для маломобильных групп (МГН)
                    </label>
                </div>
            </div>

            <div class="mb-3">
                <label for="photo_url" class="form-label">Ссылка на фото</label>
                <input type="url" class="form-control" id="photo_url" name="photo_url" placeholder="/static/images/...">
            </div>

            <div id="formError" class="alert alert-danger d-none" role="alert"></div>
            <div id="formSuccess" class="alert alert-success d-none" role="alert">Сохранено! Перенаправление...</div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/admin/routes" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
const form = document.getElementById('routeForm');
const isEdit = {{ 'true' if is_edit else 'false' }};
const itemId = {{ item_id if is_edit else 'null' }};

if (isEdit && itemId) {
    loadRouteData(itemId);
}

async function loadRouteData(id) {
    try {
        const data = await apiRequest(`/api/routes/${id}`);
        
        document.getElementById('title').value = data.title || '';
        document.getElementById('description').value = data.description || '';
        document.getElementById('duration_hours').value = data.duration_hours || '';
        document.getElementById('difficulty').value = data.difficulty || '';
        document.getElementById('transport_type').value = data.transport_type || '';
        document.getElementById('is_accessible').checked = !!data.is_accessible;
        document.getElementById('photo_url').value = data.photo_url || '';
        
    } catch (err) {
        document.getElementById('formError').textContent = 'Ошибка загрузки данных: ' + err.message;
        document.getElementById('formError').classList.remove('d-none');
    }
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('formError');
    const successDiv = document.getElementById('formSuccess');
    
    errorDiv.classList.add('d-none');
    successDiv.classList.add('d-none');

    const data = {};
        new FormData(form).forEach((value, key) => {
            if (key === 'is_accessible') {
                data[key] = value === 'on';
            } else if (value) {
                data[key] = value;
            }
        });
    
    if (data.duration_hours) data.duration_hours = parseFloat(data.duration_hours);

    try {
        let response;
        if (isEdit) {
            response = await fetch(`/api/routes/${itemId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getCookie('access_token')}`
                },
                body: JSON.stringify(data)
            });
        } else {
            response = await fetch('/api/routes/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getCookie('access_token')}`
                },
                body: JSON.stringify(data)
            });
        }

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || 'Ошибка сохранения');
        }

        successDiv.classList.remove('d-none');
        setTimeout(() => {
            window.location.href = '/admin/routes';
        }, 1500);

    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
