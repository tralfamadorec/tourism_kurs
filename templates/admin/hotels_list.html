{% extends "admin/base_admin.html" %}

{% block title %}Управление гостиницами{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Гостиницы и средства размещения</h2>
    <a href="/admin/hotels/new" class="btn btn-primary">➕ Добавить гостиницу</a>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Название</th>
                        <th>Адрес</th>
                        <th>Рейтинг</th>
                        <th>Цена/сутки</th>
                        <th class="text-end">Действия</th>
                    </tr>
                </thead>
                <tbody id="hotelsTable">
                    <tr><td colspan="5" class="text-center py-4">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
async function loadHotels() {
    const tbody = document.getElementById('hotelsTable');
    try {
        const data = await apiRequest('/api/accommodations/?limit=100');
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">Нет созданных записей</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(item => `
            <tr>
                <td><strong>${item.name}</strong></td>
                <td>${item.address || '—'}</td>
                <td>⭐ ${item.rating || '—'}</td>
                <td>${item.price_per_night ? item.price_per_night + ' ₽' : '—'}</td>
                <td class="text-end">
                    <a href="/admin/hotels/${item.id}/edit" class="btn btn-sm btn-outline-primary">✏️</a>
                    <button onclick="deleteHotel(${item.id})" class="btn btn-sm btn-outline-danger">🗑️</button>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Ошибка загрузки: ${err.message}</td></tr>`;
    }
}

async function deleteHotel(id) {
    if (!confirm('Удалить эту запись о гостинице?')) return;
    try {
        await apiRequest(`/api/accommodations/${id}`, { method: 'DELETE' });
        loadHotels();
    } catch (err) {
        alert('Ошибка удаления: ' + err.message);
    }
}

document.addEventListener('DOMContentLoaded', loadHotels);
</script>
{% endblock %}
