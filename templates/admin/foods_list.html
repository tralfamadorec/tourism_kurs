{% extends "admin/base_admin.html" %}
{% block title %}Управление ресторанами{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Рестораны и кафе</h2>
    <a href="/admin/foods/new" class="btn btn-primary">➕ Добавить заведение</a>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Фото</th>
                        <th>Название</th>
                        <th>Кухня</th>
                        <th>Адрес</th>
                        <th>Рейтинг</th>
                        <th>Ср. чек</th>
                        <th>Доступность</th>
                        <th class="text-end">Действия</th>
                    </tr>
                </thead>
                <tbody id="foodsTable">
                    <tr><td colspan="8" class="text-center py-4">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
async function loadFoods() {
    const tbody = document.getElementById('foodsTable');
    try {
        const data = await apiRequest('/api/foods/?limit=100');
        
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4">Нет записей</td></tr>';
            return;
        }
        
        tbody.innerHTML = data.map(item => {
            // Звёздочки рейтинга
            const stars = '★'.repeat(Math.round(item.rating || 0)) + '☆'.repeat(5 - Math.round(item.rating || 0));
            
            return `
                <tr>
                    <td>
                        ${item.photo_url 
                            ? `<img src="${item.photo_url}" alt="" class="img-thumbnail" style="width: 50px; height: 50px; object-fit: cover;">`
                            : '<span class="text-muted small">Нет</span>'}
                    </td>
                    <td><strong>${item.name}</strong></td>
                    <td><span class="badge bg-secondary">${item.cuisine || '—'}</span></td>
                    <td>${item.address || '—'}</td>
                    <td><span class="text-warning">${item.rating ? item.rating.toFixed(1) + ' ' + stars : '—'}</span></td>
                    <td>${item.avg_price ? item.avg_price + ' ₽' : '—'}</td>
                    <td>${item.is_accessible ? '<span class="badge bg-success">♿ Да</span>' : '<span class="badge bg-secondary">Нет</span>'}</td>
                    <td class="text-end">
                        <a href="/admin/foods/${item.id}/edit" class="btn btn-sm btn-outline-primary">✏️</a>
                        <button onclick="deleteFood(${item.id})" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </td>
                </tr>
            `;
        }).join('');
        
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4">Ошибка: ${err.message}</td></tr>`;
    }
}

async function deleteFood(id) {
    if (!confirm('Удалить это заведение?')) return;
    try {
        await apiRequest(`/api/foods/${id}`, { method: 'DELETE' });
        loadFoods();
    } catch (err) {
        alert('Ошибка: ' + err.message);
    }
}

document.addEventListener('DOMContentLoaded', loadFoods);
</script>
{% endblock %}
