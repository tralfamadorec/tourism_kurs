{% extends "admin/base_admin.html" %}

{% block title %}{{ 'Редактировать' if is_edit else 'Новое' }} событие{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ title }}</h2>
    <a href="/admin/events" class="btn btn-outline-secondary">← Назад к списку</a>
</div>

<div class="card">
    <div class="card-body">
        <form id="eventForm">
            <div class="mb-3">
                <label for="title" class="form-label">Название события *</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea class="form-control" id="description" name="description" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Категория</label>
                <select id="category" name="category" class="form-select">
                    <option value="">Не выбрана</option>
                    <option value="Концерт">Концерт</option>
                    <option value="Выставка">Выставка</option>
                    <option value="Фестиваль">Фестиваль</option>
                    <option value="Спорт">Спорт</option>
                    <option value="Детям">Детям</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="event_date" class="form-label">Дата и время *</label>
                    <input type="datetime-local" class="form-control" id="event_date" name="event_date" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="location" class="form-label">Место проведения</label>
                    <input type="text" class="form-control" id="location" name="location">
                </div>
            </div>

            <div class="col-md-6 mb-3 d-flex align-items-end">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_accessible" name="is_accessible">
                    <label class="form-check-label" for="is_accessible">
                        Доступно для маломобильных групп (МГН)
                    </label>
                </div>
            </div>

            <div class="mb-3">
                <label for="photo_url" class="form-label">Ссылка на фото</label>
                <input type="url" class="form-control" id="photo_url" name="photo_url" placeholder="/static/images/...">
            </div>

            <div id="formError" class="alert alert-danger d-none" role="alert"></div>
            <div id="formSuccess" class="alert alert-success d-none" role="alert">Сохранено! Перенаправление...</div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/admin/events" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
const form = document.getElementById('eventForm');
const isEdit = {{ 'true' if is_edit else 'false' }};
const itemId = {{ item_id if is_edit else 'null' }};

if (isEdit && itemId) {
    loadEventData(itemId);
}

async function loadEventData(id) {
    try {
        const data = await apiRequest(`/api/events/${id}`);
        
        document.getElementById('title').value = data.title || '';
        document.getElementById('description').value = data.description || '';
        
        document.getElementById('category').value = data.category || '';
        
        document.getElementById('location').value = data.location || '';
        document.getElementById('is_accessible').checked = !!data.is_accessible;
        document.getElementById('photo_url').value = data.photo_url || '';
        
        if (data.event_date) {
            const dateStr = data.event_date.slice(0, 16); 
            document.getElementById('event_date').value = dateStr;
        }
        
    } catch (err) {
        document.getElementById('formError').textContent = 'Ошибка загрузки данных: ' + err.message;
        document.getElementById('formError').classList.remove('d-none');
    }
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('formError');
    const successDiv = document.getElementById('formSuccess');
    
    errorDiv.classList.add('d-none');
    successDiv.classList.add('d-none');

    const data = {
        is_accessible: document.getElementById('is_accessible')?.checked || false
    };
    
    new FormData(form).forEach((value, key) => {
        if (key !== 'is_accessible' && value) {
            data[key] = value;
        }
    });
    
    if (data.price) data.price = parseInt(data.price);
    if (data.latitude) data.latitude = parseFloat(data.latitude);
    if (data.longitude) data.longitude = parseFloat(data.longitude);
    if (data.rating) data.rating = parseFloat(data.rating);

    try {
        let response;
        if (isEdit) {
            response = await fetch(`/api/events/${itemId}`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getCookie('access_token')}` 
                },
                body: JSON.stringify(data)
            });
        } else {
            response = await fetch('/api/events/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${getCookie('access_token')}` 
                },
                body: JSON.stringify(data)
            });
        }

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || 'Ошибка сохранения');
        }

        successDiv.classList.remove('d-none');
        setTimeout(() => { window.location.href = '/admin/events'; }, 1500);

    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
