{% extends "admin/base_admin.html" %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ title }}</h2>
    <a href="{{ back_url }}" class="btn btn-outline-secondary">← Назад</a>
</div>

<div class="card">
    <div class="card-body">
        <form id="entityForm" method="post">
            {% block form_fields %}{% endblock %}
            
            <div id="formError" class="alert alert-danger d-none" role="alert"></div>
            <div id="formSuccess" class="alert alert-success d-none" role="alert">Сохранено!</div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">💾 Сохранить</button>
                <a href="{{ back_url }}" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.getElementById('entityForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const form = e.target;
    const errorDiv = document.getElementById('formError');
    const successDiv = document.getElementById('formSuccess');
    
    errorDiv.classList.add('d-none');
    successDiv.classList.add('d-none');
    
    const formData = {};
    new FormData(form).forEach((value, key) => {
        formData[key] = value;
    });
    
    const isEdit = form.dataset.id !== undefined;
    const method = isEdit ? 'PUT' : 'POST';
    const url = isEdit 
        ? `/api{{ api_path }}/${form.dataset.id}` 
        : `/api{{ api_path }}`;
    
    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getCookie('access_token')}`
            },
            body: JSON.stringify(formData)
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Ошибка сохранения');
        }
        
        successDiv.classList.remove('d-none');
        setTimeout(() => {
            window.location.href = '{{ back_url }}';
        }, 1000);
        
    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
