{% extends "admin/base_admin.html" %}

{% block title %}{{ 'Редактировать' if is_edit else 'Новый' }} сувенир{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>{{ title }}</h2>
    <a href="/admin/souvenirs" class="btn btn-outline-secondary">← Назад к списку</a>
</div>

<div class="card">
    <div class="card-body">
        <form id="souvenirForm">
            <div class="mb-3">
                <label for="name" class="form-label">Название магазина *</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание / Ассортимент</label>
                <textarea class="form-control" id="description" name="description" rows="3" placeholder="Что продают в магазине..."></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">Тип магазина</label>
                    <select id="category" name="category" class="form-select">
                        <option value="">Не выбран</option>
                        <option value="Сувенирная лавка">Сувенирная лавка</option>
                        <option value="Мастерская">Мастерская</option>
                        <option value="Галерея">Галерея</option>
                        <option value="Торговый центр">Торговый центр</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="working_hours" class="form-label">Режим работы</label>
                    <input type="text" class="form-control" id="working_hours" name="working_hours" placeholder="Пн-Вс 10:00-20:00">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Телефон</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="+7 (___) ___-__-__">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="website" class="form-label">Сайт</label>
                    <input type="url" class="form-control" id="website" name="website" placeholder="https://...">
                </div>
            </div>

            <div class="mb-3">
                <label for="photo_url" class="form-label">Ссылка на фото</label>
                <input type="url" class="form-control" id="photo_url" name="photo_url" placeholder="/static/images/...">
            </div>

            <div id="formError" class="alert alert-danger d-none" role="alert"></div>
            <div id="formSuccess" class="alert alert-success d-none" role="alert">Сохранено! Перенаправление...</div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/admin/souvenirs" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
const form = document.getElementById('souvenirForm');
const isEdit = {{ 'true' if is_edit else 'false' }};
const itemId = {{ item_id if is_edit else 'null' }};

if (isEdit && itemId) {
    loadSouvenirData(itemId);
}

async function loadSouvenirData(id) {
    try {
        const data = await apiRequest(`/api/souvenirs/${id}`);
        
        document.getElementById('name').value = data.name || '';
        document.getElementById('description').value = data.description || '';
        document.getElementById('category').value = data.category || '';
        document.getElementById('working_hours').value = data.working_hours || '';
        document.getElementById('phone').value = data.phone || '';
        document.getElementById('website').value = data.website || '';
        document.getElementById('photo_url').value = data.photo_url || '';
        
    } catch (err) {
        document.getElementById('formError').textContent = 'Ошибка загрузки данных: ' + err.message;
        document.getElementById('formError').classList.remove('d-none');
    }
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('formError');
    const successDiv = document.getElementById('formSuccess');
    
    errorDiv.classList.add('d-none');
    successDiv.classList.add('d-none');

    const data = {};
    new FormData(form).forEach((value, key) => {
        if (value) data[key] = value;
    });

    try {
        let response;
        if (isEdit) {
            response = await fetch(`/api/souvenirs/${itemId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getCookie('access_token')}` },
                body: JSON.stringify(data)
            });
        } else {
            response = await fetch('/api/souvenirs/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getCookie('access_token')}` },
                body: JSON.stringify(data)
            });
        }

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || 'Ошибка сохранения');
        }

        successDiv.classList.remove('d-none');
        setTimeout(() => { window.location.href = '/admin/souvenirs'; }, 1500);

    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
