{% extends "admin/base_admin.html" %}
{% block title %}Управление ресторанами{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Рестораны и кафе</h2>
    <a href="/admin/restaurants/new" class="btn btn-primary">➕ Добавить заведение</a>
</div>
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Название</th>
                        <th>Кухня</th>
                        <th>Адрес</th>
                        <th>Рейтинг</th>
                        <th>Ср. чек</th>
                        <th class="text-end">Действия</th>
                    </tr>
                </thead>
                <tbody id="restaurantsTable">
                    <tr><td colspan="6" class="text-center py-4">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
async function loadRestaurants() {
    const tbody = document.getElementById('restaurantsTable');
    try {
        const data = await apiRequest('/api/restaurants/?limit=100');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Нет записей</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(item => `
            <tr>
                <td><strong>${item.name}</strong></td>
                <td>${item.cuisine || '—'}</td>
                <td>${item.address || '—'}</td>
                <td>⭐ ${item.rating || '—'}</td>
                <td>${item.avg_price ? item.avg_price + ' ₽' : '—'}</td>
                <td class="text-end">
                    <a href="/admin/restaurants/${item.id}/edit" class="btn btn-sm btn-outline-primary">✏️</a>
                    <button onclick="deleteRestaurant(${item.id})" class="btn btn-sm btn-outline-danger">🗑️</button>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Ошибка: ${err.message}</td></tr>`;
    }
}
async function deleteRestaurant(id) {
    if (!confirm('Удалить это заведение?')) return;
    try {
        await apiRequest(`/api/restaurants/${id}`, { method: 'DELETE' });
        loadRestaurants();
    } catch (err) { alert('Ошибка: ' + err.message); }
}
document.addEventListener('DOMContentLoaded', loadRestaurants);
</script>
{% endblock %}
