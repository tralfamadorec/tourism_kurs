<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ачинск туристический{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🏛️ Ачинск Туристический</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/attractions">Достопримечательности</a></li>
                    <li class="nav-item"><a class="nav-link" href="/routes">Маршруты</a></li>
                    <li class="nav-item"><a class="nav-link" href="/hotels">Гостиницы</a></li>
                    <li class="nav-item"><a class="nav-link" href="/food">Где вкусно?</a></li>
                    <li class="nav-item"><a class="nav-link" href="/events">События</a></li>
                    <li class="nav-item"><a class="nav-link" href="/safety">Безопасность</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="/admin" class="btn btn-outline-light btn-sm d-none" id="adminBtn">Панель администратора</a>

                    <span id="userStatus" class="text-white me-3 small"></span>
                    <a href="/login" class="btn btn-outline-light btn-sm" id="authBtn">Вход</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light text-center py-3 border-top">
        <div class="container">
            <p class="mb-0 text-muted">© 2024 ТИЦ г. Ачинска. Интеграция с ach-invest.ru</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
