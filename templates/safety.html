{% extends "base.html" %}

{% block title %}Справочник безопасности | Ачинск{% endblock %}

{% block content %}
<div class="text-center py-4 bg-light rounded mb-4">
    <h1>Справочник безопасности</h1>
    <p class="text-muted">Экстренные службы и медицинские учреждения Ачинска</p>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label small text-muted">Поиск</label>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Название организации или адрес...">
            </div>
            
            <div class="col-md-4">
                <label class="form-label small text-muted">Категория</label>
                <select id="categoryFilter" class="form-select form-select-sm">
                    <option value="">Все службы</option>
                    <option value="Полиция">Полиция</option>
                    <option value="МЧС">МЧС</option>
                    <option value="Скорая помощь">Скорая помощь</option>
                    <option value="Медицина">Больницы</option>
                    <option value="Аптека">Аптеки</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <!-- Кнопка сброса -->
            <div class="col-md-2 d-flex align-items-end">
                <button id="resetBtn" class="btn btn-outline-secondary btn-sm w-100">Сбросить</button>
            </div>
        </div>
    </div>
</div>

<div id="safetyList" class="row g-3">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Загрузка справочника...</p>
    </div>
</div>

<div class="text-center mt-5 mb-4">
    <button id="loadMoreBtn" class="btn btn-outline-primary btn-lg px-5 d-none">
        Показать еще
    </button>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
const limit = 12;

async function loadSafetyObjects(append = false) {
    const listEl = document.getElementById('safetyList');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    if (!append) {
        listEl.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Загрузка...</p></div>';
    }
    
    try {
        const search = document.getElementById('searchInput').value;
        const category = document.getElementById('categoryFilter').value;
        
        let url = `/api/safety/?limit=${limit}&skip=${(currentPage - 1) * limit}`;
        
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (category) url += `&category=${encodeURIComponent(category)}`;

        const response = await fetch(url);
        const data = await response.json();
        
        if (!append) listEl.innerHTML = '';
        
        if (data.length === 0 && currentPage === 1) {
            listEl.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">Записи не найдены</p></div>';
            loadMoreBtn.classList.add('d-none');
            return;
        }
        
        if (data.length === 0) {
            loadMoreBtn.classList.add('d-none');
            return;
        }
        
        // иконки для категорий
        const icons = {
            'Полиция': '👮',
            'МЧС': '🚒',
            'Скорая помощь': '🚑',
            'Медицина': '🏥',
            'Аптека': '💊',
            'Другое': '📍'
        };

        data.forEach(item => {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';
            
            const icon = icons[item.category] || '📍';

            col.innerHTML = `
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <span class="fs-2 me-2">${icon}</span>
                            <h5 class="card-title mb-0">${item.name}</h5>
                        </div>
                        
                        <p class="card-text text-muted small mb-2">${item.category}</p>
                        ${item.address ? `<p class="card-text small mb-2">📍 ${item.address}</p>` : ''}
                        
                        <div class="mt-3">
                            <a href="/safety/${item.id}" class="btn btn-outline-primary btn-sm w-100">
                                Подробнее
                            </a>
                        </div>
                    </div>
                </div>
            `;
            listEl.appendChild(col);
        });
        
        if (data.length === limit) {
            loadMoreBtn.classList.remove('d-none');
        } else {
            loadMoreBtn.classList.add('d-none');
        }
        
    } catch (err) {
        listEl.innerHTML = `<div class="col-12 text-center text-danger py-5">Ошибка загрузки: ${err.message}</div>`;
    }
}

// обработчики
document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; loadSafetyObjects(); });
document.getElementById('categoryFilter').addEventListener('change', () => { currentPage = 1; loadSafetyObjects(); });
document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('categoryFilter').value = '';
    currentPage = 1;
    loadSafetyObjects();
});

document.getElementById('loadMoreBtn').addEventListener('click', () => {
    currentPage++;
    loadSafetyObjects(true);
});

document.addEventListener('DOMContentLoaded', () => loadSafetyObjects());
</script>
{% endblock %}
