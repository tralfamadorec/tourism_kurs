{% extends "base.html" %}

{% block title %}Сувениры из Ачинска{% endblock %}

{% block content %}
<div class="text-center py-4 bg-light rounded mb-4">
    <h1>Сувениры из Ачинска</h1>
    <p class="text-muted">Памятные подарки от местных мастеров и производителей</p>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label small text-muted">Поиск</label>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Название или производитель...">
            </div>
            
            <div class="col-md-3">
                <label class="form-label small text-muted">Цена до</label>
                <select id="priceFilter" class="form-select form-select-sm">
                    <option value="">Любая цена</option>
                    <option value="500">До 500 ₽</option>
                    <option value="1000">До 1000 ₽</option>
                    <option value="2000">До 2000 ₽</option>
                    <option value="5000">До 5000 ₽</option>
                </select>
            </div>
            
            <div class="col-md-3">
                <label class="form-label small text-muted">Категория</label>
                <select id="categoryFilter" class="form-select form-select-sm">
                    <option value="">Все категории</option>
                    <option value="Съедобные">Съедобные</option>
                    <option value="Одежда">Одежда и аксессуары</option>
                    <option value="Декор">Декор и интерьер</option>
                    <option value="Прочее">Прочее</option>
                </select>
            </div>
            
            <div class="col-md-2 d-flex align-items-end">
                <button id="resetBtn" class="btn btn-outline-secondary btn-sm w-100">Сбросить</button>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <label class="form-label small text-muted d-block mb-2">Сортировка</label>
                <div class="btn-group w-100" role="group">
                    <button type="button" class="btn btn-outline-primary btn-sm active" data-sort="price_asc">Сначала дешевле</button>
                    <button type="button" class="btn btn-outline-primary btn-sm" data-sort="price_desc">Сначала дороже</button>
                    <button type="button" class="btn btn-outline-primary btn-sm" data-sort="name">По названию</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="souvenirsList" class="row g-4">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Загрузка сувениров...</p>
    </div>
</div>

<div class="text-center mt-5 mb-4">
    <button id="loadMoreBtn" class="btn btn-outline-primary btn-lg px-5 d-none">
        Показать еще
    </button>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 1;
const limit = 6;
let currentSort = 'price_asc';

async function loadSouvenirs(append = false) {
    const listEl = document.getElementById('souvenirsList');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    
    if (!append) {
        listEl.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2">Загрузка...</p></div>';
    }
    
    try {
        const search = document.getElementById('searchInput').value;
        const maxPrice = document.getElementById('priceFilter').value;
        const category = document.getElementById('categoryFilter').value;
        
        let url = `/api/souvenirs/?limit=${limit}&skip=${(currentPage - 1) * limit}`;
        
        if (search) url += `&search=${encodeURIComponent(search)}`;
        if (maxPrice) url += `&max_price=${maxPrice}`;
        if (category) url += `&category=${encodeURIComponent(category)}`;
        url += `&sort=${currentSort}`;

        const response = await fetch(url);
        const data = await response.json();
        
        if (!append) listEl.innerHTML = '';
        
        if (data.length === 0 && currentPage === 1) {
            listEl.innerHTML = '<div class="col-12 text-center py-5"><p class="text-muted">Сувениры не найдены</p></div>';
            loadMoreBtn.classList.add('d-none');
            return;
        }
        
        if (data.length === 0) {
            loadMoreBtn.classList.add('d-none');
            return;
        }
        
        data.forEach(item => {
            const col = document.createElement('div');
            col.className = 'col-md-4 col-lg-3'; // Компактные карточки для сувениров
            
            col.innerHTML = `
                <div class="card h-100 shadow-sm hover-shadow">
                    ${item.photo_url ? `<img src="${item.photo_url}" class="card-img-top" alt="${item.name}" style="height: 180px; object-fit: cover;">` : '<div class="bg-secondary text-white d-flex align-items-center justify-content-center" style="height: 180px;">Нет фото</div>'}
                    <div class="card-body p-3">
                        <h6 class="card-title mb-1">${item.name}</h6>
                        <p class="text-muted small mb-2">${item.producer || 'Производитель не указан'}</p>
                        <p class="card-text small text-truncate">${item.description || ''}</p>
                    </div>
                    <div class="card-footer bg-white border-top-0 p-3 pt-0 d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-primary">${item.price ? item.price + ' ₽' : '—'}</span>
                        <a href="/souvenirs/${item.id}" class="btn btn-sm btn-outline-primary">Подробнее</a>
                    </div>
                </div>
            `;
            listEl.appendChild(col);
        });
        
        if (data.length === limit) {
            loadMoreBtn.classList.remove('d-none');
        } else {
            loadMoreBtn.classList.add('d-none');
        }
        
    } catch (err) {
        listEl.innerHTML = `<div class="col-12 text-center text-danger py-5">Ошибка загрузки: ${err.message}</div>`;
    }
}

// обработчики фильтров
document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; loadSouvenirs(); });
document.getElementById('priceFilter').addEventListener('change', () => { currentPage = 1; loadSouvenirs(); });
document.getElementById('categoryFilter').addEventListener('change', () => { currentPage = 1; loadSouvenirs(); });

// обработчики сортировки
document.querySelectorAll('[data-sort]').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentSort = e.target.dataset.sort;
        currentPage = 1;
        loadSouvenirs();
    });
});

// кнопка сброса
document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('priceFilter').value = '';
    document.getElementById('categoryFilter').value = '';
    currentSort = 'price_asc';
    currentPage = 1;
    
    document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-sort="price_asc"]').classList.add('active');
    
    loadSouvenirs();
});

// показать еще
document.getElementById('loadMoreBtn').addEventListener('click', () => {
    currentPage++;
    loadSouvenirs(true);
});

// инициализация
document.addEventListener('DOMContentLoaded', () => loadSouvenirs());
</script>

<style>
.hover-shadow { transition: box-shadow 0.3s ease; }
.hover-shadow:hover { box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important; }
</style>
{% endblock %}
