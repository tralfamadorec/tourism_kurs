{% extends "base.html" %}

{% block title %}Интерактивная карта | Ачинск туристический{% endblock %}

{% block content %}
<div class="text-center py-4 bg-light rounded mb-4">
    <h1>Интерактивная карта Ачинска</h1>
    <p class="text-muted">Все важные объекты города на одной карте</p>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label small text-muted">Поиск по названию</label>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Название или адрес...">
            </div>
            
            <div class="col-md-5">
                <label class="form-label small text-muted">Категория объектов</label>
                <select id="typeFilter" class="form-select form-select-sm">
                    <option value="all">Все объекты</option>
                    <option value="attraction">Достопримечательности</option>
                    <option value="accommodation">Гостиницы</option>
                    <option value="food">Где вкусно?</option>
                    <option value="safety">Службы безопасности</option>
                    <option value="souvenir">Сувенирные магазины</option>
                </select>
            </div>

            <div class="col-md-2">
                <button id="resetBtn" class="btn btn-outline-secondary btn-sm w-100">Сбросить</button>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm mb-4">
    <div class="card-body p-1">
        <div id="map" style="height: 500px; border-radius: 4px;"></div>
    </div>
</div>

<h4 class="mb-3">Все объекты на карте</h4>
<div id="objectsList" class="row g-3 mb-5">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Загрузка данных...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://api-maps.yandex.ru/2.1/?apikey=aef84873-3320-4b26-a718-627fa9bec3c6&lang=ru_RU" type="text/javascript"></script>

<script>
let myMap;
let objectCollection;
let allObjects = [];

ymaps.ready(init);

function init() {
    myMap = new ymaps.Map("map", {
        center: [56.2659, 90.4969],
        zoom: 13,
        controls: ['zoomControl', 'fullscreenControl']
    });

    objectCollection = new ymaps.GeoObjectCollection({}, {
        balloonMaxWidth: 300
    });

    myMap.geoObjects.add(objectCollection);
    loadAllData();
}

async function loadAllData() {
    const apis = [
        { type: 'attraction', url: '/api/attractions/?limit=100', name: 'Достопримечательности' },
        { type: 'accommodation', url: '/api/accommodations/?limit=100', name: 'Гостиницы' },
        { type: 'food', url: '/api/foods/?limit=100', name: 'Питание' },
        { type: 'safety', url: '/api/safety/?limit=100', name: 'Безопасность' },
        { type: 'souvenir', url: '/api/souvenirs/?limit=100', name: 'Сувениры' }
    ];

    const container = document.getElementById('objectsList');
    
    try {
        const promises = apis.map(async (api) => {
            try {
                const response = await fetch(api.url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.map(item => ({
                    ...item,
                    objType: api.type,
                    displayName: item.name || item.title || 'Без названия'
                }));
            } catch (err) {
                console.error(`Ошибка загрузки ${api.name}:`, err);
                return [];
            }
        });

        const results = await Promise.all(promises);
        allObjects = results.flat();
        
        renderMap(allObjects);
        renderList(allObjects);
        
        if (allObjects.length === 0) {
            container.innerHTML = '<div class="col-12 text-center py-5 text-muted">Объекты не найдены</div>';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const focusParam = urlParams.get('focus');
        
        if (focusParam && allObjects.length > 0) {
            setTimeout(() => focusOnObjectFromParam(focusParam), 500);
        }
        
    } catch (err) {
        console.error('Критическая ошибка:', err);
        container.innerHTML = `<div class="col-12 text-center text-danger py-5">Ошибка: ${err.message}</div>`;
    }
}

function renderMap(objects) {
    objectCollection.removeAll();

    const presets = {
        'attraction': 'islands#blueCircleIcon',
        'accommodation': 'islands#greenCircleIcon',
        'food': 'islands#orangeCircleIcon',
        'safety': 'islands#redCircleIcon',
        'souvenir': 'islands#violetCircleIcon'
    };

    const typeLabels = {
        'attraction': 'Достопримечательность',
        'accommodation': 'Гостиница',
        'food': 'Заведение',
        'safety': 'Служба',
        'souvenir': 'Магазин'
    };

    objects.forEach(obj => {
        if (!obj.latitude || !obj.longitude) return;

        // Ссылка на маршрут в Яндекс.Картах
        const routeUrl = `https://yandex.ru/maps/?rtext=~${obj.latitude},${obj.longitude}&rtt=auto`;

        const placemark = new ymaps.Placemark(
            [obj.latitude, obj.longitude],
            {
                balloonContentHeader: obj.displayName,
                balloonContentBody: `
                    <strong>${typeLabels[obj.objType] || 'Объект'}</strong><br>
                    ${obj.address || obj.location || ''}<br>
                    ${obj.phone ? '📞 ' + obj.phone + '<br>' : ''}
                    <a href="${routeUrl}" target="_blank" class="btn btn-sm btn-outline-primary mt-2" style="text-decoration: none;">
                        Построить маршрут
                    </a>
                `,
                hintContent: obj.displayName
            },
            { preset: presets[obj.objType] || 'islands#blueCircleIcon' }
        );

        objectCollection.add(placemark);
    });

    if (objects.length > 0) {
        myMap.setBounds(objectCollection.getBounds(), { checkZoomRange: true, zoomMargin: 50 });
    }
}

function renderList(objects) {
    const container = document.getElementById('objectsList');
    container.innerHTML = '';

    const typeIcons = {
        'attraction': '🏛️',
        'accommodation': '🏨',
        'food': '🍽️',
        'safety': '🛡️',
        'souvenir': '🎁'
    };

    objects.forEach(obj => {
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';
        
        const hasCoords = obj.latitude && obj.longitude;
        const routeUrl = hasCoords ? `https://yandex.ru/maps/?rtext=~${obj.latitude},${obj.longitude}&rtt=auto` : '#';
        
        col.innerHTML = `
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="card-title mb-0">${obj.displayName}</h6>
                        <span>${typeIcons[obj.objType] || '📍'}</span>
                    </div>
                    <p class="small text-muted mb-1">${obj.address || obj.location || 'Адрес не указан'}</p>
                    ${obj.phone ? `<p class="small mb-2">📞 ${obj.phone}</p>` : ''}
                    
                    ${hasCoords ? `
                        <div class="d-grid gap-2">
                            <button onclick="focusOnObject(${obj.latitude}, ${obj.longitude})" 
                                    class="btn btn-sm btn-outline-primary">
                                Показать на карте
                            </button>
                            <a href="${routeUrl}" target="_blank" class="btn btn-sm btn-outline-secondary">
                                Построить маршрут
                            </a>
                        </div>
                    ` : '<span class="badge bg-secondary">Нет координат</span>'}
                </div>
            </div>
        `;
        container.appendChild(col);
    });
}

function focusOnObject(lat, lon) {
    myMap.setCenter([lat, lon], 16);
    document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function focusOnObjectFromParam(focusParam) {
    const parts = focusParam.split('-');
    if (parts.length < 2) return;
    
    const type = parts[0];
    const id = parseInt(parts[1]);
    
    const obj = allObjects.find(o => o.objType === type && o.id === id);
    
    if (obj && obj.latitude && obj.longitude) {
        myMap.setCenter([obj.latitude, obj.longitude], 16);
        
        objectCollection.removeAll();
        
        const presets = {
            'attraction': 'islands#blueCircleIcon',
            'accommodation': 'islands#greenCircleIcon',
            'food': 'islands#orangeCircleIcon',
            'safety': 'islands#redCircleIcon',
            'souvenir': 'islands#violetCircleIcon'
        };
        
        const routeUrl = `https://yandex.ru/maps/?rtext=~${obj.latitude},${obj.longitude}&rtt=auto`;
        
        const placemark = new ymaps.Placemark(
            [obj.latitude, obj.longitude],
            {
                balloonContentHeader: obj.displayName,
                balloonContentBody: `
                    <strong>${obj.address || obj.location || ''}</strong><br>
                    ${obj.phone ? '📞 ' + obj.phone + '<br>' : ''}
                    <a href="${routeUrl}" target="_blank" class="btn btn-sm btn-outline-primary mt-2" style="text-decoration: none;">
                        Построить маршрут
                    </a>
                `
            },
            { preset: presets[obj.objType] || 'islands#blueCircleIcon' }
        );
        
        objectCollection.add(placemark);
        placemark.balloon.open();
        
        document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        document.querySelectorAll('.card').forEach(card => {
            if (card.innerHTML.includes(obj.displayName)) {
                card.classList.add('border-primary', 'border-2');
                setTimeout(() => card.classList.remove('border-primary', 'border-2'), 3000);
            }
        });
    }
}

function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const type = document.getElementById('typeFilter').value;

    const filtered = allObjects.filter(obj => {
        const matchType = (type === 'all') || (obj.objType === type);
        const matchSearch = obj.displayName.toLowerCase().includes(search) || 
                           (obj.address && obj.address.toLowerCase().includes(search));
        return matchType && matchSearch;
    });

    renderMap(filtered);
    renderList(filtered);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('typeFilter').addEventListener('change', applyFilters);
document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('typeFilter').value = 'all';
    applyFilters();
});
</script>
{% endblock %}
